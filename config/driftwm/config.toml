# driftwm - trackpad-first infinite canvas compositor. Every built-in default is documented in
# config.reference.toml inside the package; only overrides live here.
#
# The canvas has no workspaces, so mango's per-monitor tags have no analogue: Mod+1-4 are camera
# bookmarks instead. What is ported is the launcher set, the input setup and the monitor layout.

# XDG autostart entries run too, so this list only carries what ships no .desktop autostart entry.
# VPN and solaar are systemd units now (modules/vpn.nix, modules/hardware.nix).
autostart = [
  "Telegram",
  "discord",
  "spotify",
  "$TERMINAL --app-id herdr -e herdr",
  "webapp https://notes.metsker.dev/brain/",
]

[env]
NIXOS_OZONE_WL = "1"

# The store path moves on every rebuild, so go through the system profile's stable one.
# pink_cloud declares neither u_time nor u_zoom, so it slides rigidly with the camera and
# cache_shader can bake it once instead of re-evaluating it every frame the viewport moves.
[background]
type = "shader"
path = "/run/current-system/sw/share/driftwm/wallpapers/animated/acid_lava.glsl"
cache_shader = false

[input.keyboard]
layout = "us,ru"
options = "caps:escape,grp:ctrl_space_toggle"
repeat_rate = 25
repeat_delay = 600

[input.mouse]
natural_scroll = false

[input.trackpad]
tap_to_click = true
tap_and_drag = true
natural_scroll = true
disable_while_typing = true

# Two of the three outputs are 1920x1080 panels, so auto-detection cannot tell them apart.
[input.touch]
map_to_output = "HDMI-A-3"

# Same layout as config/mango/monitors.conf: HDMI-A-2 left, DP-1 right, the touch panel under DP-1.
[[outputs]]
name = "HDMI-A-2"
mode = "1920x1080@144"
position = [0, 0]

[[outputs]]
name = "DP-1"
mode = "1920x1080@75"
position = [1920, 0]

[[outputs]]
name = "HDMI-A-3"
mode = "1920x1080@60"
position = [1920, 1080]

[keybindings]
# Launchers. exec/spawn both go through sh, so $TERMINAL expands.
"mod+space" = "spawn noctalia msg panel-toggle launcher"
"mod+d" = "none"
"mod+alt+return" = "exec $TERMINAL --app-id herdr -e herdr"
"mod+shift+return" = "exec zen-beta"
"mod+shift+f" = "exec $TERMINAL -e yazi"
"mod+shift+s" = "exec $TERMINAL --working-directory ~/dotfiles/ -e nvim modules/"
"mod+shift+d" = "exec $TERMINAL --working-directory ~/dotfiles/config/driftwm/ -e nvim ."
"mod+alt+shift+f" = "exec dolphin"
"mod+escape" = "spawn noctalia msg panel-toggle session"

# Clipboard (mac-style): the script sends Ctrl+C/V in apps, Ctrl+Shift+C/V in terminals.
# Mod+C and Mod+Shift+C both go to the clipboard, displacing driftwm's center-window onto
# Mod+Ctrl+C; Mod+X still focus-centers.
"mod+c" = "spawn clipboard copy"
"mod+v" = "spawn clipboard paste"
"mod+ctrl+c" = "center-window"

# The screenshot script asks mango for window boxes, so here it slurps without window snapping.
"Print" = "spawn screenshot"
"mod+Print" = "spawn colorpicker"
"mod+ctrl+Print" = "spawn textpicker"
"mod+alt+Print" = "spawn record"
"shift+Print" = "none"

"mod+shift+c" = "spawn noctalia msg panel-toggle clipboard"

"mod+shift+r" = "reload-config"

# The autostarted apps map on the monitor the camera is not on; let them arrive without stealing it.
[[window_rules]]
app_id = "org.telegram.desktop"
focus_on_open = false

[[window_rules]]
app_id = "discord"
focus_on_open = false

[[window_rules]]
app_id = "spotify"
focus_on_open = false

[[window_rules]]
app_id = "herdr"
focus_on_open = false

[[window_rules]]
app_id = "notes.metsker.dev__brain"
focus_on_open = false

[[window_rules]]
app_id = "AmneziaVPN"
focus_on_open = false
