id = "metsker/window-info"
name = "Window Info"
version = "1.6.0"
plugin_api = 24
author = "metsker"
license = "MIT"
dependencies = ["wminfo"]
icon = "app-window"
description = "Shows the focused window's title or app id, and writes the compositor float rule you right-click."
tags = ["bar", "mangowc", "umbriel"]

[[widget]]
id = "window"
entry = "window-info.luau"

  # Widget-level: a narrow bar and a wide one want different caps, and the two can
  # carry the same widget.
  [[widget.setting]]
  key             = "max_length"
  type            = "int"
  label_key       = "settings.max_length.label"
  description_key = "settings.max_length.description"
  default         = 40
  min             = 5
  max             = 200

  # The app's own icon identifies the window faster than any glyph can, so it is
  # the default; turning it off falls back to the mode glyphs below.
  [[widget.setting]]
  key             = "app_icon"
  type            = "bool"
  label_key       = "settings.app_icon.label"
  description_key = "settings.app_icon.description"
  default         = true

  # One per mode, because with no icon the glyph is what says which of the two is showing.
  [[widget.setting]]
  key             = "title_glyph"
  type            = "glyph"
  label_key       = "settings.title_glyph.label"
  description_key = "settings.title_glyph.description"
  default         = "app-window"

  [[widget.setting]]
  key             = "appid_glyph"
  type            = "glyph"
  label_key       = "settings.appid_glyph.label"
  description_key = "settings.appid_glyph.description"
  default         = "tag"

# Middle click opens a widget's settings everywhere in the shell by default, and a
# bound gesture wins over the script, so onMiddleClick only fires once the button is
# unbound. Users can rebind it per instance.
[widget.actions]
middle = "none"
