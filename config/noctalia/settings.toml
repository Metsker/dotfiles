[widget.bar]
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.bar_2]
extras = "none"
show_glyph = false
show_value = false
type = "felipeartur/ai-usagebar:bar"
visualization = "gauge"

[widget.clock]
format = "{:%b %d, %H:%M}"

[widget.launcher]
glyph = "noctalia"

[widget.layout]
type = "metsker/mango-layout:layout"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

    [widget.media.actions]
    left = "media toggle"
    right = "panel-toggle control-center media"

[widget.network]
show_label = false

[widget.nix-monitor]
colorize_glyph = false
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"
up_to_date_glyph = "heart-check"

[widget.notifications]
enabled = false

[widget.recorder]
enabled = true
type = "noctalia/screen_recorder:recorder"

[widget.spacer_2]
enabled = true
type = "spacer"

[widget.status]
idle_glyph = "microphone-mute"
recording_glyph = "bluetooth-device-microphone"
stopped_glyph = "microphone-mute"
streaming_glyph = "bluetooth-device-microphone"
type = "gabedunn/voxtype:status"

[widget.tray]
detached_panel = true
drawer = true

[widget.volume.actions]
scroll_down = "volume-down 1"
scroll_up = "volume-up 1"

[widget.window]
type = "metsker/window-info:window"

[widget.workspaces]
enabled = true
focused_output_only = true
show_labels = false