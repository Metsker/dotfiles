config_version = 13

[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.74999998323619366
capsule_radius = 8
center = [ "nix-monitor", "bar", "spacer_2", "clock", "spacer_2", "status", "bar_2", "recorder" ]
end = [
    "media",
    "audio_visualizer",
    "tray",
    "volume",
    "network",
    "bluetooth",
    "brightness",
    "battery",
    "keyboard_layout",
    "notifications"
]
margin_edge = 8
margin_ends = 8
radius = 16
shadow = false
start = [ "launcher", "workspaces", "layout", "window" ]

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[control_center]
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "wallpaper"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
border_width = 1.0
reserve_space = false
shadow = false

[hooks]
session_unlocked = "mmsg dispatch reload_config"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
down = [ "down", "ctrl+n", "ctrl+j" ]
up = [ "up", "ctrl+p", "ctrl+k" ]

[location]
address = "Zelenogradsk, Russia"

