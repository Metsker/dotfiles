[nightlight]
enabled = true
force = true
temperature_night = 4500

[osd.kinds]
keyboard_layout = false
media = false
privacy = false

[plugin_settings."avivbintangaringga/nix-monitor"]
panel_placement = "floating"

[plugin_settings."blackbartblues/keymap"]
compositor = "mangowc"
mangowc_config = "/home/metsker/dotfiles/config/mango/config.conf"

[plugin_settings."ezequiel/mango_layouts"]
panel_position = "auto"

[plugin_settings."felipeartur/ai-usagebar"]
panel_open_near_click = true
panel_placement = "floating"

[plugin_settings."metsker/mango-layout"]
corner_roundness = 0.0
picker_placement = "floating"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "default_output"
hide_inactive = true
video_source = "portal"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "noctalia/timer",
    "metsker/mango-layout",
    "avivbintangaringga/nix-monitor",
    "gabedunn/voxtype",
    "felipeartur/ai-usagebar",
    "metsker/window-info"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/metsker/dotfiles/config/noctalia/plugins"
    name = "local"

[shell]
avatar_path = "/home/metsker/Chest/Media/pics/a staff/4444.jpg"
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
launch_apps_as_systemd_services = true
polkit_agent = true

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    shadow = false
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    command = "uwsm stop"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
