[bar.default]
background_opacity = 0.80000000000000004
capsule_radius = 8
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "keyboard_layout"
]
margin_edge = 8
margin_ends = 8
radius = 16
start = [ "workspaces", "layout" ]

[dock]
auto_hide = true
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 681.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[plugins]
enabled = [ "metsker/mango-layout" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/metsker/dotfiles/config/noctalia/plugins"
    name = "local"

[shell]
corner_radius_scale = 0.20000000000000001
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.greeter_sync]
    privilege_command = "foot -e pkexec"

    [shell.launcher]
    categories = false

[theme]
builtin = "Catppuccin"
community_palette = "Gruvbox Material"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "mango", "qt" ]
    community_ids = [ "zen-browser", "neovim", "yazi" ]

[wallpaper.default]
path = "/home/metsker/Pictures/Wallpapers/images/my-neighbor-totoro-sunflowers.png"

[wallpaper.last]
path = "/home/metsker/Pictures/Wallpapers/images/my-neighbor-totoro-sunflowers.png"

[wallpaper.monitors.Virtual-1]
path = "/home/metsker/Pictures/Wallpapers/images/my-neighbor-totoro-sunflowers.png"

[widget.layout]
type = "metsker/mango-layout:layout"

[widget.media]
hide_when_no_media = true

[widget."metsker/mango-layout:layout"]
enabled = true

[widget.network]
show_label = false

[widget.spacer_2]
enabled = true
type = "spacer"

[widget.workspaces]
display = "none"
enabled = true