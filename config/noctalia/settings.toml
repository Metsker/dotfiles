[bar.default]
background_opacity = 0.79999998211860657
margin_edge = 8
margin_ends = 8

[dock]
auto_hide = true
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 640.0
    cy = 681.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
corner_radius_scale = 0.20000000298023224
font_family = "JetBrainsMono Nerd Font"

    [shell.launcher]
    categories = false

[theme]
builtin = "Eldritch"
community_palette = "Everforest"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "niri" ]
    community_ids = [ "neovim", "yazi" ]

[wallpaper.default]
path = "/home/metsker/Pictures/Wallpapers/images/my-neighbor-totoro-sunflowers.png"

[wallpaper.last]
path = "/home/metsker/Pictures/Wallpapers/images/my-neighbor-totoro-sunflowers.png"

[wallpaper.monitors.Virtual-1]
path = "/home/metsker/Pictures/Wallpapers/images/my-neighbor-totoro-sunflowers.png"

[widget.VPN]
type = "custom_button"