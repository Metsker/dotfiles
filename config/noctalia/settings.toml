config_version = 2

[bar.default]
background_opacity = 0.80000000000000004
capsule_radius = 8
center = [ "clock", "recorder" ]
contact_shadow = false
end = [
    "media",
    "audio_visualizer",
    "spacer_1",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "keyboard_layout"
]
margin_edge = 8
margin_ends = 8
radius = 16
shadow = false
start = [ "wallhaven", "workspaces", "layout" ]

[control_center.calendar]
show_events_card = false

[dock]
auto_hide = true
reserve_space = false
shadow = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[osd.kinds]
keyboard_layout = false

[plugin_settings."noctalia/screen_recorder"]
hide_inactive = true

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/example", "metsker/mango-layout", "noctalia/wallhaven" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/metsker/dotfiles/config/noctalia/plugins"
    name = "local"

[shell]
corner_radius_scale = 0.20000000000000001
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true
    privilege_command = "foot -e pkexec"

    [shell.launcher]
    categories = false

    [shell.panel]
    shadow = false

[theme]
builtin = "Catppuccin"
community_palette = "Gruvbox Material"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "mango", "qt" ]
    community_ids = [ "zen-browser", "neovim", "yazi" ]

[wallpaper.default]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[wallpaper.last]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[wallpaper.monitors.DP-1]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[wallpaper.monitors.HDMI-A-2]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[widget.audio_visualizer]
centered = false

[widget.layout]
enabled = true
type = "metsker/mango-layout:layout"

[widget.media]
hide_when_no_media = true

[widget."metsker/mango-layout:layout"]
enabled = true

[widget.network]
show_label = false

[widget.recorder]
enabled = true
type = "noctalia/screen_recorder:recorder"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
enabled = true
type = "spacer"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
display = "none"
enabled = true
focused_output_only = true