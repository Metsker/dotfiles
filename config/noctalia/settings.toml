config_version = 2

[bar.default]
background_opacity = 0.74999998323619366
capsule_radius = 8
center = [ "clock", "recorder" ]
end = [
    "audio_visualizer",
    "media",
    "spacer_1",
    "tray",
    "bar",
    "volume",
    "network",
    "bluetooth",
    "brightness",
    "battery",
    "keyboard_layout",
    "notifications"
]
margin_edge = 8
margin_ends = 8
radius = 16
shadow = false
start = [ "wallhaven", "workspaces", "layout" ]

[control_center]
hidden_tabs = [ "power" ]

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "wallpaper"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
reserve_space = false
shadow = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
down = [ "down", "ctrl+n", "ctrl+j" ]
up = [ "up", "ctrl+p", "ctrl+k" ]

[location]
address = "Zelenogradsk, Russia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true
force = true
temperature_night = 4500

[osd.kinds]
keyboard_layout = false
media = false

[plugin_settings."noctalia/screen_recorder"]
hide_inactive = true
video_source = "portal"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"

[plugins]
enabled = [ "noctalia/screen_recorder", "metsker/mango-layout", "noctalia/wallhaven", "noctalia/timer" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/metsker/dotfiles/config/noctalia/plugins"
    name = "local"

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    shadow = false
    transparency_mode = "soft"
    wallpaper_placement = "floating"

[theme]
builtin = "Tokyo-Night"
community_palette = "Atuel"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "hyprland", "mango", "qt" ]
    community_ids = [ "zen-browser", "neovim", "yazi" ]

        [theme.templates.user.monstar]
        input_path = "/home/metsker/dotfiles/config/noctalia/templates/monstar"
        output_path = "~/.config/monstar/themes/noctalia"
        post_hook = "pkill -USR1 monstar 2>/dev/null || true"

[wallpaper.default]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[wallpaper.last]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[wallpaper.monitors.DP-1]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[wallpaper.monitors.HDMI-A-2]
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/metsker/Pictures/Wallpapers/wallhaven-qrjww5.jpg"
theme_mode = "dark"
wallpaper_scheme = "m3-content"

[widget.bar]
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.clock]
format = "{:%a %H:%M}"

[widget.layout]
type = "metsker/mango-layout:layout"

[widget.media]
hide_when_no_media = true

[widget."metsker/mango-layout:layout"]
enabled = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
enabled = true
type = "noctalia/screen_recorder:recorder"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
enabled = true
type = "spacer"

[widget.tray]
detached_panel = true
drawer = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
display = "none"
enabled = true
focused_output_only = true