# ---- Environment ----
# Reset on every reload; apps read them at launch.
env=QT_QPA_PLATFORMTHEME,qt6ct

# ---- Display ----
# Force FullHD@60 on every output (matches niri's 1920x1080@60, scale 1).
monitorrule=name:.*,width:1920,height:1080,refresh:60,scale:1,x:0,y:0

# ---- Appearance (Noctalia palette) ----
gappih=8
gappiv=8
gappoh=8
gappov=8
borderpx=3
smartgaps=0
no_border_when_single=0
border_radius=0

# ---- Scroller ----
scroller_structs = 8
scroller_prefer_overspread = 1
scroller_default_proportion = 0.5
scroller_ignore_proportion_single = 0
scroller_proportion_preset=1.0,0.75,0.5


# ---- Animations ----
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide

# ---- Focus & cursor (match niri) ----
sloppyfocus=1
warpcursor=0
focus_on_activate=1
cursor_hide_timeout=5
cursor_theme=Adwaita
cursor_size=24

# ---- Keyboard ----
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us,ru
xkb_rules_options=caps:escape,grp:ctrl_space_toggle

# ---- Trackpad / mouse ----
tap_to_click=1
tap_and_drag=1
disable_while_typing=1
trackpad_natural_scrolling=1
mouse_natural_scrolling=0

# ---- Misc ----
xwayland_persistence=1

# ---- Tag layouts (tile on every tag) ----
# layouts: tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller

# ---- Autostart ----
# Push session env (incl. XDG_SESSION_ID for logout) to systemd/dbus, then start Noctalia.
# graphical-session.target has RefuseManualStart=yes, so start noctalia.service directly.
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_ID
exec-once=systemctl --user start noctalia.service

# ===================== Key Bindings =====================
# mod keys: super,ctrl,alt,shift,none. key names: see `wev`.

bind=SUPER,r,switch_proportion_preset

# Session
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,e,quit
bind=SUPER,q,killclient,

# Launchers (match niri muscle memory)
bind=SUPER,Return,spawn,foot
bind=SUPER+ALT,Return,spawn,foot -e herdr
bind=SUPER+SHIFT,Return,spawn,zen-beta
bind=SUPER+SHIFT,f,spawn,foot -e yazi
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session

# Screenshots (grim + slurp -> satty annotation editor -> ~/Pictures/Screenshots)
bind=NONE,Print,spawn,screenshot-full
bind=SUPER,Print,spawn,screenshot-region

# Focus (arrows + hjkl)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Tab,focusstack,next

# Move / swap window
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Window state
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,n,switch_layout
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad

# Resize / move floating
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50

# Gaps
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps

# Tags: view / move-to
bind=SUPER,1,comboview,1,0
bind=SUPER,2,comboview,2,0
bind=SUPER,3,comboview,3,0
bind=SUPER,4,comboview,4,0
bind=SUPER,5,comboview,5,0
bind=SUPER,6,comboview,6,0
bind=SUPER,7,comboview,7,0
bind=SUPER,8,comboview,8,0
bind=SUPER,9,comboview,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitors (match niri: Ctrl focus, Ctrl+Shift move)
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,l,tagmon,right

bind=SUPER,o,toggleoverview

# ---- Media / brightness keys ----
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# ---- Mouse ----
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

source=~/.config/mango/noctalia.conf
