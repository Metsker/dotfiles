# Env lives in ~/.config/uwsm/env; Noctalia starts via its user service on graphical-session.target.
# XDG_SESSION_ID too: user units sit outside the session cgroup, so noctalia cannot find its logind session by PID.
exec-once=uwsm finalize XDG_SESSION_ID
# nm-online: with autologin the session starts before the network is up; connecting too early stalls for 60s+.
exec-once=uwsm app -- sh -c 'nm-online -q -t 30; exec AmneziaVPN'
exec-once=uwsm app -- openrgb-profile carrot
exec-once=uwsm app -- solaar-start
exec-once=uwsm app -- Telegram
exec-once=uwsm app -- discord
exec-once=uwsm app -- monstar --app-id herdr -e herdr
exec-once=uwsm app -- webapp https://notes.metsker.dev/brain/
# exec-once=uwsm app -- webapp https://music.youtube.com/
exec-once=uwsm app -- spotify
