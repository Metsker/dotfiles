# mods: super,ctrl,alt,shift,none; keys: see `wev`
bind=SUPER,r,switch_proportion_preset

# Session
bind=SUPER+SHIFT,r,reload_config
# bind=SUPER+SHIFT,e,quit
bind=SUPER,q,killclient,

# Launchers
bind=SUPER,Return,spawn,term
bind=SUPER+ALT,Return,spawn,term -e herdr
bind=SUPER+SHIFT,Return,spawn,zen-beta
bind=SUPER+SHIFT,f,spawn,term -e yazi
bind=SUPER+SHIFT,s,spawn, term --working-directory ~/dotfiles/ -e nvim home.nix
bind=SUPER+SHIFT,m,spawn, term --working-directory ~/dotfiles/config/mango/ -e nvim .
bind=SUPER+ALT+SHIFT,f,spawn,nemo
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session

# Clipboard (mac-style): clipboard script sends Ctrl+C/V in apps, Ctrl+Shift+C/V in terminals (wtype, focus-aware).
bind=SUPER,c,spawn,clipboard copy
bind=SUPER,v,spawn,clipboard paste
bind=SUPER+SHIFT,c,spawn,noctalia msg panel-toggle clipboard

bind=NONE,Print,spawn,screenshot
bind=SUPER,Print,spawn,colorpicker
bind=SUPER+CTRL,Print,spawn,textpicker
bind=SUPER+ALT,Print,spawn,noctalia msg plugin noctalia/screen_recorder:service all toggle

# Focus (arrows + hjkl)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Tab,focusstack,next

# Move / swap window
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Window state
bind=SUPER,p,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,n,spawn,noctalia msg panel-toggle metsker/mango-layout:picker
bind=SUPER,z,toggle_scratchpad

# Tags view (viewcrossmon focuses target): SUPER+N -> tag N on HDMI-A-2, SUPER+ALT+N -> tag N on DP-1.
bind=SUPER,1,viewcrossmon,1,HDMI-A-2
bind=SUPER,2,viewcrossmon,2,HDMI-A-2
bind=SUPER,3,viewcrossmon,3,HDMI-A-2
bind=SUPER,4,viewcrossmon,4,HDMI-A-2
bind=SUPER,5,viewcrossmon,5,HDMI-A-2
bind=SUPER,6,viewcrossmon,6,HDMI-A-2
bind=SUPER,7,viewcrossmon,7,HDMI-A-2
bind=SUPER,8,viewcrossmon,8,HDMI-A-2
bind=SUPER,9,viewcrossmon,9,HDMI-A-2
bind=SUPER+ALT,1,viewcrossmon,1,DP-1
bind=SUPER+ALT,2,viewcrossmon,2,DP-1
bind=SUPER+ALT,3,viewcrossmon,3,DP-1
bind=SUPER+ALT,4,viewcrossmon,4,DP-1
bind=SUPER+ALT,5,viewcrossmon,5,DP-1
bind=SUPER+ALT,6,viewcrossmon,6,DP-1
bind=SUPER+ALT,7,viewcrossmon,7,DP-1
bind=SUPER+ALT,8,viewcrossmon,8,DP-1
bind=SUPER+ALT,9,viewcrossmon,9,DP-1
bind=SUPER+ALT+CTRL,1,viewcrossmon,1,HDMI-A-3
bind=SUPER+ALT+CTRL,2,viewcrossmon,2,HDMI-A-3
bind=SUPER+ALT+CTRL,3,viewcrossmon,3,HDMI-A-3
bind=SUPER+ALT+CTRL,4,viewcrossmon,4,HDMI-A-3
bind=SUPER+ALT+CTRL,5,viewcrossmon,5,HDMI-A-3
bind=SUPER+ALT+CTRL,6,viewcrossmon,6,HDMI-A-3
bind=SUPER+ALT+CTRL,7,viewcrossmon,7,HDMI-A-3
bind=SUPER+ALT+CTRL,8,viewcrossmon,8,HDMI-A-3
bind=SUPER+ALT+CTRL,9,viewcrossmon,9,HDMI-A-3

# Move focused window per-monitor (tagcrossmon): SUPER+SHIFT+N -> tag N on HDMI-A-2, SUPER+ALT+SHIFT+N -> tag N on DP-1.
bind=SUPER+SHIFT,1,tagcrossmon,1,HDMI-A-2
bind=SUPER+SHIFT,2,tagcrossmon,2,HDMI-A-2
bind=SUPER+SHIFT,3,tagcrossmon,3,HDMI-A-2
bind=SUPER+SHIFT,4,tagcrossmon,4,HDMI-A-2
bind=SUPER+SHIFT,5,tagcrossmon,5,HDMI-A-2
bind=SUPER+SHIFT,6,tagcrossmon,6,HDMI-A-2
bind=SUPER+SHIFT,7,tagcrossmon,7,HDMI-A-2
bind=SUPER+SHIFT,8,tagcrossmon,8,HDMI-A-2
bind=SUPER+SHIFT,9,tagcrossmon,9,HDMI-A-2
bind=SUPER+ALT+SHIFT,1,tagcrossmon,1,DP-1
bind=SUPER+ALT+SHIFT,2,tagcrossmon,2,DP-1
bind=SUPER+ALT+SHIFT,3,tagcrossmon,3,DP-1
bind=SUPER+ALT+SHIFT,4,tagcrossmon,4,DP-1
bind=SUPER+ALT+SHIFT,5,tagcrossmon,5,DP-1
bind=SUPER+ALT+SHIFT,6,tagcrossmon,6,DP-1
bind=SUPER+ALT+SHIFT,7,tagcrossmon,7,DP-1
bind=SUPER+ALT+SHIFT,8,tagcrossmon,8,DP-1
bind=SUPER+ALT+SHIFT,9,tagcrossmon,9,DP-1
bind=SUPER+SHIFT+ALT+CTRL,1,tagcrossmon,1,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,2,tagcrossmon,2,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,3,tagcrossmon,3,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,4,tagcrossmon,4,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,5,tagcrossmon,5,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,6,tagcrossmon,6,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,7,tagcrossmon,7,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,8,tagcrossmon,8,HDMI-A-3
bind=SUPER+SHIFT+ALT+CTRL,9,tagcrossmon,9,HDMI-A-3

bind=SUPER,a,viewtoleft
bind=SUPER,d,viewtoright
bind=SUPER+SHIFT,a,tagtoleft
bind=SUPER+SHIFT,d,tagtoright
bind=SUPER,u,viewtoleft
bind=SUPER,i,viewtoright
bind=SUPER+SHIFT,u,tagtoleft
bind=SUPER+SHIFT,i,tagtoright

# Monitors
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,Down,focusmon,down
bind=SUPER+CTRL,Up,focusmon,up

bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,l,tagmon,right
bind=SUPER+CTRL+SHIFT,j,tagmon,down
bind=SUPER+CTRL+SHIFT,k,tagmon,up
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,Down,tagmon,down
bind=SUPER+CTRL+SHIFT,Up,tagmon,up

bind=SUPER,o,toggleoverview
bind=SUPER,s,spawn,noctalia msg settings-toggle
bind=SUPER,t,spawn,noctalia msg panel-toggle noctalia/timer:panel

# ---- Media / brightness keys ----
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.01+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.01-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# ---- Mouse ----
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
