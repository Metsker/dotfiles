# Monitor names are referenced by keybinds.conf (viewcrossmon/tagcrossmon) and rules.conf.
monitorrule=name:DP-1,width:1920,height:1080,refresh:75,scale:1,x:1920,y:0
monitorrule=name:HDMI-A-2,width:1920,height:1080,refresh:144,scale:1,x:0,y:0
# Touchscreen panel, sits below DP-1; input.conf binds touch input to this output.
monitorrule=name:HDMI-A-3,width:1920,height:1080,refresh:60,scale:1,x:1920,y:1080
