onboarding = false

[keys]
prefix = "ctrl+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
move_tab_previous = "prefix+alt+p"
move_tab_next = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[terminal]
new_cwd = "follow"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#acd0a7"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#292a27"
selection_bg = "#343532"
surface0 = "#292a27"
surface1 = "#343532"
surface_dim = "#121411"
overlay0 = "#8d9289"
overlay1 = "#c3c8be"
text = "#e3e3de"
subtext0 = "#c3c8be"
mauve = "#d6c787"
green = "#acd0a7"
yellow = "#b7ccc1"
red = "#ffb4ab"
blue = "#9dcedd"
teal = "#dac3a7"
peach = "#ffdeab"

[update]
version_check = false

[ui]
agent_panel_sort = "priority"
pane_gaps = false
pane_outer_borders = false
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["state_text"]]
