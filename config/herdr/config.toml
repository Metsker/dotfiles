onboarding = false

[keys]
prefix = "ctrl+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
move_tab_previous = "prefix+alt+p"
move_tab_next = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[terminal]
new_cwd = "follow"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
selection_bg = "#999999"
active_row_bg = "#444444"
surface_dim = "#444444"

[experimental]
kitty_graphics = true

[update]
version_check = false

[ui]
agent_panel_sort = "priority"
pane_gaps = false
pane_outer_borders = false
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["state_text"]]
