onboarding = false

[keys]
prefix = "ctrl+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
move_tab_previous = "prefix+alt+p"
move_tab_next = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[terminal]
new_cwd = "follow"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#85cfff"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#262a2e"
selection_bg = "#313539"
surface0 = "#262a2e"
surface1 = "#313539"
surface_dim = "#101417"
overlay0 = "#89929a"
overlay1 = "#bfc8d0"
text = "#e0e3e7"
subtext0 = "#bfc8d0"
mauve = "#aac8ff"
green = "#85cfff"
yellow = "#abcbe2"
red = "#ffb4ab"
blue = "#eab2ff"
teal = "#c4c3e9"
peach = "#ffdeab"

[update]
version_check = false

[ui]
agent_panel_sort = "priority"
pane_gaps = false
pane_outer_borders = false
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["state_text"]]
