# Umbriel - noctalia's own wlroots compositor. Every option is documented in the upstream
# examples/config.toml and at https://docs.noctalia.dev/umbriel/.
[include]
files = [
  "outputs.toml",
  "appearance.toml",
  "input.toml",
  "layout.toml",
  "rules.toml",
  "keybinds.toml",
  "noctalia.toml",
]

[general]
show_cheatsheet = false
xwayland = true
# VPN and solaar are systemd units now (modules/vpn.nix, modules/hardware.nix).
autostart = [
  "Telegram",
  "discord",
  "spotify",
  "$TERMINAL --app-id herdr -e herdr",
  "webapp https://notes.metsker.dev/brain/",
]

[environment]
NIXOS_OZONE_WL = "1"

[animation.workspaces]
enabled = false

[overview]
shortcuts = false
