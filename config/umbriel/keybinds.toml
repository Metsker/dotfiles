# Actions are listed by `umbriel msg --help`; key names follow xkb (see `wev`).
[keybinds]
"Mod+Q" = "window-close"
"Mod+F" = "window-toggle-fullscreen"
"Mod+M" = "window-toggle-maximize"
"Mod+Alt+M" = "window-toggle-maximize-to-edges"
"Mod+T" = "window-toggle-floating"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-or-expel-left"
"Mod+Period" = "window-consume-or-expel-right"
"Mod+Slash"="cheatsheet-toggle"

"Mod+Left" = "window-focus-or-output-left"
"Mod+Down" = "window-focus-or-output-down"
"Mod+Up" = "window-focus-or-output-up"
"Mod+Right" = "window-focus-or-output-right"
"Mod+H" = "window-focus-or-output-left"
"Mod+J" = "window-focus-or-output-down"
"Mod+K" = "window-focus-or-output-up"
"Mod+L" = "window-focus-or-output-right"

"Mod+Shift+Left" = "window-move-or-output-left"
"Mod+Shift+Down" = "window-move-or-output-down"
"Mod+Shift+Up" = "window-move-or-output-up"
"Mod+Shift+Right" = "window-move-or-output-right"
"Mod+Shift+H" = "window-move-or-output-left"
"Mod+Shift+J" = "window-move-or-output-down"
"Mod+Shift+K" = "window-move-or-output-up"
"Mod+Shift+L" = "window-move-or-output-right"

"Mod+Return" = "spawn:$TERMINAL"
"Mod+Alt+Return" = "spawn:$TERMINAL -e herdr"
"Mod+Shift+Return" = "spawn:zen-beta"
"Mod+Shift+F" = "spawn:$TERMINAL -e yazi"
"Mod+Shift+S" = "spawn:$TERMINAL --working-directory ~/dotfiles/ -e nvim modules/"
"Mod+Shift+W" = "spawn:$TERMINAL --working-directory ~/dotfiles/config/umbriel/ -e nvim ."
"Mod+Alt+Shift+F" = "spawn:dolphin"
"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"

"Mod+C" = "spawn:clipboard copy"
"Mod+V" = "spawn:clipboard paste"
"Mod+Shift+V" = "spawn:noctalia msg panel-toggle clipboard"

"Print" = "spawn:screenshot"
"Mod+Print" = "spawn:colorpicker"
"Mod+Ctrl+Print" = "spawn:textpicker"
"Mod+Alt+Print" = "spawn:record"

"Mod+Y" = { action = "spawn:voxtype record toggle", repeat = false }

"Mod+Z" = "scratchpad-toggle"
"Mod+Shift+Z" = "window-toggle-scratchpad"
"Mod+O" = { action = "overview-toggle", repeat = false }

"Mod+P" = "workspace-previous"
"Mod+N" = "workspace-next"
"Mod+Shift+P" = "window-move-to-workspace-previous"
"Mod+Shift+N" = "window-move-to-workspace-next"

"Mod+1" = "workspace-switch:1/HDMI-A-2"
"Mod+2" = "workspace-switch:2/HDMI-A-2"
"Mod+3" = "workspace-switch:3/HDMI-A-2"
"Mod+4" = "workspace-switch:4/HDMI-A-2"
"Mod+5" = "workspace-switch:5/HDMI-A-2"
"Mod+6" = "workspace-switch:6/HDMI-A-2"
"Mod+7" = "workspace-switch:7/HDMI-A-2"
"Mod+8" = "workspace-switch:8/HDMI-A-2"
"Mod+9" = "workspace-switch:9/HDMI-A-2"
"Mod+Alt+1" = "workspace-switch:1/DP-1"
"Mod+Alt+2" = "workspace-switch:2/DP-1"
"Mod+Alt+3" = "workspace-switch:3/DP-1"
"Mod+Alt+4" = "workspace-switch:4/DP-1"
"Mod+Alt+5" = "workspace-switch:5/DP-1"
"Mod+Alt+6" = "workspace-switch:6/DP-1"
"Mod+Alt+7" = "workspace-switch:7/DP-1"
"Mod+Alt+8" = "workspace-switch:8/DP-1"
"Mod+Alt+9" = "workspace-switch:9/DP-1"
"Mod+Ctrl+1" = "workspace-switch:1/HDMI-A-3"
"Mod+Ctrl+2" = "workspace-switch:2/HDMI-A-3"
"Mod+Ctrl+3" = "workspace-switch:3/HDMI-A-3"
"Mod+Ctrl+4" = "workspace-switch:4/HDMI-A-3"
"Mod+Ctrl+5" = "workspace-switch:5/HDMI-A-3"
"Mod+Ctrl+6" = "workspace-switch:6/HDMI-A-3"
"Mod+Ctrl+7" = "workspace-switch:7/HDMI-A-3"
"Mod+Ctrl+8" = "workspace-switch:8/HDMI-A-3"
"Mod+Ctrl+9" = "workspace-switch:9/HDMI-A-3"

"Mod+Shift+1" = "window-move-to-workspace:1/HDMI-A-2"
"Mod+Shift+2" = "window-move-to-workspace:2/HDMI-A-2"
"Mod+Shift+3" = "window-move-to-workspace:3/HDMI-A-2"
"Mod+Shift+4" = "window-move-to-workspace:4/HDMI-A-2"
"Mod+Shift+5" = "window-move-to-workspace:5/HDMI-A-2"
"Mod+Shift+6" = "window-move-to-workspace:6/HDMI-A-2"
"Mod+Shift+7" = "window-move-to-workspace:7/HDMI-A-2"
"Mod+Shift+8" = "window-move-to-workspace:8/HDMI-A-2"
"Mod+Shift+9" = "window-move-to-workspace:9/HDMI-A-2"
"Mod+Alt+Shift+1" = "window-move-to-workspace:1/DP-1"
"Mod+Alt+Shift+2" = "window-move-to-workspace:2/DP-1"
"Mod+Alt+Shift+3" = "window-move-to-workspace:3/DP-1"
"Mod+Alt+Shift+4" = "window-move-to-workspace:4/DP-1"
"Mod+Alt+Shift+5" = "window-move-to-workspace:5/DP-1"
"Mod+Alt+Shift+6" = "window-move-to-workspace:6/DP-1"
"Mod+Alt+Shift+7" = "window-move-to-workspace:7/DP-1"
"Mod+Alt+Shift+8" = "window-move-to-workspace:8/DP-1"
"Mod+Alt+Shift+9" = "window-move-to-workspace:9/DP-1"
"Mod+Ctrl+Shift+1" = "window-move-to-workspace:1/HDMI-A-3"
"Mod+Ctrl+Shift+2" = "window-move-to-workspace:2/HDMI-A-3"
"Mod+Ctrl+Shift+3" = "window-move-to-workspace:3/HDMI-A-3"
"Mod+Ctrl+Shift+4" = "window-move-to-workspace:4/HDMI-A-3"
"Mod+Ctrl+Shift+5" = "window-move-to-workspace:5/HDMI-A-3"
"Mod+Ctrl+Shift+6" = "window-move-to-workspace:6/HDMI-A-3"
"Mod+Ctrl+Shift+7" = "window-move-to-workspace:7/HDMI-A-3"
"Mod+Ctrl+Shift+8" = "window-move-to-workspace:8/HDMI-A-3"
"Mod+Ctrl+Shift+9" = "window-move-to-workspace:9/HDMI-A-3"

"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-"
