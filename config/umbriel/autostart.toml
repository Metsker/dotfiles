# XDG autostart entries run too, so this list only carries what ships no .desktop entry.
# The rules that place these windows live here beside the list that starts them.
[general]
autostart = [
  "$TERMINAL --app-id herdr -e herdr",
  "Telegram",
  "discord",
  "spotify",
  "webapp https://notes.metsker.dev/brain/",
  "webapp https://notes.metsker.dev/gamedev/",
]

[[window_rule]]
match.app_id = "^org[.]telegram[.]desktop$"
match.at_startup = true
default_output = "DP-1"
default_workspace = 2
default_focused = false

[[window_rule]]
match.app_id = "^discord$"
match.at_startup = true
default_output = "DP-1"
default_workspace = 2
default_focused = false

[[window_rule]]
match.app_id = "^spotify$"
match.at_startup = true
default_output = "DP-1"
default_workspace = 3
default_focused = false

[[window_rule]]
match.app_id = "^herdr$"
match.at_startup = true
default_output = "DP-1"
default_workspace = 1
default_focused = false

[[window_rule]]
match.app_id = "^chrome-notes[.]metsker[.]dev__brain$"
match.at_startup = true
default_output = "HDMI-A-3"
default_workspace = 1
default_focused = false

[[window_rule]]
match.app_id = "^chrome-notes[.]metsker[.]dev__gamedev$"
match.at_startup = true
default_output = "HDMI-A-3"
default_workspace = 2
default_focused = false
