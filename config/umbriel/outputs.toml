# Output names are referenced by keybinds.toml (per-monitor workspaces) and rules.toml.
[output.HDMI-A-2]
mode = "1920x1080@144"
position = [0, 0]
workspaces = 9

[output.DP-1]
mode = "1920x1080@75"
position = [1920, 0]
workspaces = 9

[output.HDMI-A-3]
mode = "1920x1080@60"
position = [1920, 1080]
workspaces = 9
