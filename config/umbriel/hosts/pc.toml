# The desktop: the ARZOPA panel on DP-2 with a 1080p monitor on HDMI-A-1 to its right. Everything that names an output lives in this file.
# Keyed by connector, so moving a cable to another port means renaming it here.
[output.DP-2]
mode = "2560x1440@180"
scale = 1.25
position = [0, 0]
focus_at_startup = true
workspaces = 9

# x = 2560 / 1.25, the ARZOPA's logical width.
[output.HDMI-A-1]
mode = "1920x1080@60"
scale = 1.0
position = [2048, 0]
workspaces = 9

[layout]
mode = "scrolling"

[keybinds]
"Mod+1" = "workspace-switch:1/DP-2"
"Mod+2" = "workspace-switch:2/DP-2"
"Mod+3" = "workspace-switch:3/DP-2"
"Mod+4" = "workspace-switch:4/DP-2"
"Mod+5" = "workspace-switch:5/DP-2"
"Mod+6" = "workspace-switch:6/DP-2"
"Mod+7" = "workspace-switch:7/DP-2"
"Mod+8" = "workspace-switch:8/DP-2"
"Mod+9" = "workspace-switch:9/DP-2"

"Mod+Shift+1" = "window-move-to-workspace:1/DP-2"
"Mod+Shift+2" = "window-move-to-workspace:2/DP-2"
"Mod+Shift+3" = "window-move-to-workspace:3/DP-2"
"Mod+Shift+4" = "window-move-to-workspace:4/DP-2"
"Mod+Shift+5" = "window-move-to-workspace:5/DP-2"
"Mod+Shift+6" = "window-move-to-workspace:6/DP-2"
"Mod+Shift+7" = "window-move-to-workspace:7/DP-2"
"Mod+Shift+8" = "window-move-to-workspace:8/DP-2"
"Mod+Shift+9" = "window-move-to-workspace:9/DP-2"

"Mod+Alt+1" = "workspace-switch:1/HDMI-A-1"
"Mod+Alt+2" = "workspace-switch:2/HDMI-A-1"
"Mod+Alt+3" = "workspace-switch:3/HDMI-A-1"
"Mod+Alt+4" = "workspace-switch:4/HDMI-A-1"
"Mod+Alt+5" = "workspace-switch:5/HDMI-A-1"
"Mod+Alt+6" = "workspace-switch:6/HDMI-A-1"
"Mod+Alt+7" = "workspace-switch:7/HDMI-A-1"
"Mod+Alt+8" = "workspace-switch:8/HDMI-A-1"
"Mod+Alt+9" = "workspace-switch:9/HDMI-A-1"

"Mod+Alt+Shift+1" = "window-move-to-workspace:1/HDMI-A-1"
"Mod+Alt+Shift+2" = "window-move-to-workspace:2/HDMI-A-1"
"Mod+Alt+Shift+3" = "window-move-to-workspace:3/HDMI-A-1"
"Mod+Alt+Shift+4" = "window-move-to-workspace:4/HDMI-A-1"
"Mod+Alt+Shift+5" = "window-move-to-workspace:5/HDMI-A-1"
"Mod+Alt+Shift+6" = "window-move-to-workspace:6/HDMI-A-1"
"Mod+Alt+Shift+7" = "window-move-to-workspace:7/HDMI-A-1"
"Mod+Alt+Shift+8" = "window-move-to-workspace:8/HDMI-A-1"
"Mod+Alt+Shift+9" = "window-move-to-workspace:9/HDMI-A-1"

# Autostart and the at_startup rules that place those apps, kept together so they cannot drift.
[general]
autostart = [
  "$TERMINAL --app-id herdr -e herdr",
  "Telegram",
  "discord",
  "spotify",
  "webapp https://notes.metsker.dev/brain",
]

[[window_rule]]
match.app_id = "^herdr$"
match.at_startup = true
default_output = "DP-2"
default_workspace = 1
default_focused = false

[[window_rule]]
match.app_id = "^org[.]telegram[.]desktop$"
match.at_startup = true
default_output = "DP-2"
default_workspace = 2
default_focused = false

[[window_rule]]
match.app_id = "^discord$"
match.at_startup = true
default_output = "DP-2"
default_workspace = 2
default_focused = false

[[window_rule]]
match.app_id = "^spotify$"
match.at_startup = true
default_output = "DP-2"
default_workspace = 3
default_focused = false

[[window_rule]]
match.app_id = "^chrome-notes[.]metsker[.]dev__brain-Default$"
match.at_startup = true
default_output = "HDMI-A-1"
default_workspace = 1
default_focused = false
