# Window and layer rules, in order - a later rule overrides the settings it repeats.
# No blur_optimized here: with it off, a window blurs only the surfaces behind it, and a window
# over nothing but the wallpaper has none - the global optimized blur is what reaches the backdrop.

[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.is_alone = true
default_maximize = true

[[window_rule]]
match.app_id = "^md[.]Obsidian$"
match.title = "Settings|Community themes|Community plugins"
default_floating = true

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^(com[.]gabm[.]satty|mpv|imv|engrampa)$"
default_floating = true
default_floating_size = { width = 0.75, height = 0.75 }

[[window_rule]]
match.app_id = "^AmneziaVPN$"
default_floating = true

[[window_rule]]
match.app_id = "^org[.]telegram[.]desktop$"
match.title = "^Media viewer$"
default_floating = true

[[window_rule]]
match.title = "^Select Folder$"
default_floating = true

[[window_rule]]
match.app_id = "^zen$"
match.title = "^Library$"
default_floating = true

[[window_rule]]
match.app_id = "^[Ss]team$"
match.title = "^(?!Steam$).*"
default_floating = true

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_floating = true
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[[layer_rule]]
match.namespace = "^(selection|wayfreeze|hyprpicker)$"
blur = false
