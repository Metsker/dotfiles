# MANGOHUD=1 is session-wide; OpenGL games still need `mangohud <game>` (Lutris/Prism have toggles).
fps_only
position=top-left
font_size=20
background_alpha=0.4

toggle_hud=Shift_R+F12

# Desktop apps that load Vulkan, by exe basename; GTK apps are skipped by MangoHud itself.
blacklist=.umbriel-wrapped,.Telegram-wrapped,.Discord-wrapped,.xdg-desktop-portal-kde-wrapped,zen,mpv
